<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <title>RAIM 예약현황 일괄 출력 설정</title>
    <style>
      body { font: 14px/1.6 "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif; color: #1f2937; margin: 16px; min-width: 360px; }
      h1 { font-size: 16px; margin: 0 0 12px; }
      fieldset { border: 1px solid #e5e7eb; border-radius: 10px; padding: 10px 12px; margin: 0 0 12px; }
      legend { font-weight: 700; font-size: 13px; padding: 0 4px; }
      label { display: flex; align-items: center; gap: 6px; margin: 4px 0; }
      select, input[type="number"] { font: inherit; padding: 3px 6px; border: 1px solid #d1d5db; border-radius: 6px; }
      .hint { color: #6b7280; font-size: 12px; margin: 4px 0 0; }
      button { font: inherit; font-weight: 700; background: #0f62fe; color: #fff; border: 0; border-radius: 8px; padding: 8px 14px; cursor: pointer; }
      #status { margin-left: 8px; color: #047857; font-size: 13px; }
    </style>
  </head>
  <body>
    <h1>RAIM 예약현황 일괄 출력 설정</h1>

    <fieldset>
      <legend>기본 다운로드 사유</legend>
      <select id="reason"></select>
      <p class="hint">공공예약 엑셀 출력 화면의 사유 선택지와 같습니다. 엑셀을 받을 때마다 사이트에 기록됩니다.</p>
    </fieldset>

    <fieldset>
      <legend>요청 간격</legend>
      <label><input type="number" id="gap" min="800" max="5000" step="100" /> ms</label>
      <p class="hint">서비스마다 엑셀을 받을 때 사이에 쉬는 시간입니다. 사이트에 부담을 주지 않도록 800ms 아래로는 내려가지 않습니다.</p>
    </fieldset>

    <button id="save" type="button">저장</button><span id="status" role="status"></span>

    <script src="../shared.js"></script>
    <script src="options.js"></script>
  </body>
</html>
